# V1: impact / narrative bot
# 旧 docker-compose.yml から移行（2026-09-30）
#
# 実行はリポジトリルートから:
#   docker compose -f docker/v1.yml up -d
name: impact-v1

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: impact-narrative-db
    ports:
      - "8000:8000"
    volumes:
      # ⚠️ 旧 ./.env.test をマウントしていた。ローカルでは空ディレクトリのため
      #    env/v1.test.env を用意してから有効にすること
      - ../env/v1.test.env:/app/.env
      - ../credentials:/app/credentials:ro
      - ../.chroma_categories:/app/.chroma_categories
      - ../.runtime:/app/.runtime
    environment:
      - USE_POLLING=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
