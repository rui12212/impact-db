# V1: portfolio bot
# 旧 docker-compose.portfolio.yml から移行（2026-09-30）
#
# 実行はリポジトリルートから:
#   docker compose -f docker/v1.portfolio.yml up -d
name: impact-v1-portfolio

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../env/v1.env
    container_name: portfolio-bot
    ports:
      - "8000:8000"
    volumes:
      - ../env/v1.env:/app/.env
      - ../credentials:/app/credentials:ro
      - ../.chroma_categories:/app/.chroma_categories
      - ../.runtime:/app/.runtime
    environment:
      - USE_POLLING=False
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/project
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
